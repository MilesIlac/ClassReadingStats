[versions]
# Plugins
agp = "8.11.2"
kotlin = "2.2.20"
ksp = "2.2.20-2.0.3"

# Core
coreKtx = "1.17.0"
lifecycleVersion = "2.9.4"
activity-compose = "1.11.0"
appcompat = "1.7.1"
material = "1.14.0-alpha05"
constraintlayout = "2.2.1"
navigationVersion = "2.9.5"

# Serialization
serialization = "1.9.0"

# Compose
compose-bom = "2025.09.00" #update removes current icons integration

# Room
room = "2.8.2"

# Apache POI
poi-version = "5.4.1"

# CameraX
camerax-version = "1.5.1"

# Google ML-Kit Text Recognition
ml-kit-version = "16.0.1"

# OpenCV
opencv-version = "4.12.0"

# FuzzyWuzzy Kotlin
fuzzy-version = "1.0.1"

# Testing Dependencies
junit = "4.13.2"
junitAndroid = "1.3.0"
espressoCore = "3.7.0"


[libraries]
# Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycleVersion" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleVersion" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleVersion" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigationVersion" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigationVersion" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationVersion" }

# Serialization
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Room
androidx-room = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler-ksp = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-ktx-coroutines = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-paging = { module = "androidx.room:room-paging", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# Apache POI
apache-poi = { module = "org.apache.poi:poi", version.ref = "poi-version" }
apache-poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi-version" }

# CameraX
androidx-camera = { module = "androidx.camera:camera-camera2", version.ref = "camerax-version" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax-version" }
androidx-camera-video = { module = "androidx.camera:camera-video", version.ref = "camerax-version" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax-version" }
androidx-camera-extensions = { module = "androidx.camera:camera-extensions", version.ref = "camerax-version" }

# Google ML-Kit Text Recognition
google-mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "ml-kit-version" }

# FuzzyWuzzy Kotlin
fuzzy-wuzzy-kotlin = { module = "com.github.jens-muenker:fuzzywuzzy-kotlin", version.ref = "fuzzy-version" }

# OpenCV
opencv = { module = "org.opencv:opencv", version.ref = "opencv-version" }

# Testing Dependencies
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitAndroid" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
# Android plugin
android-application = { id = "com.android.application", version.ref = "agp" }

# Kotlin plugin
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# KSP plugin
google-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# Add the Compose Compiler Gradle plugin, the version matches the Kotlin plugin
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

